packages:
  - "k8s-view"
  - "gitlab-ci-view"
  - "packages/*"

# All packages use "catalog:" instead of version numbers; Renovate updates versions here.
catalog:
  typescript: 7.0.2
  "@biomejs/biome": 2.6.2
  "@types/node": 24.19.2
  "@types/mocha": 10.0.10
  esbuild: 0.28.2
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  vite: 8.3.5
  "@vitejs/plugin-react": 6.1.2
  "@vscode-elements/elements": 2.5.1
  "@vscode-elements/react-elements": 2.4.0
  "@vscode/codicons": 0.0.46-24
  "@tanstack/react-table": 9.3.1
  "@tanstack/react-virtual": 3.14.21
  vscode-messenger: 0.7.0
  vscode-messenger-webview: 0.7.0
  vscode-messenger-common: 0.7.0
  "@kubernetes/client-node": 2.0.1
  # Matches the current client-node version; fetch + dispatcher for raw list/get requests
  undici: 8.12.3
  vscode-kubernetes-tools-api: 1.3.0
  "@needle-di/core": 1.2.1
  zod: 4.6.7
  jsonc-parser: 3.3.1
  jsonpath-plus: 11.2.1
  yaml: 2.9.1
  vitest: 5.0.5
  "@vitest/coverage-v8": 5.0.5
  "@testing-library/react": 16.3.3
  happy-dom: 21.0.4
  "@vscode/test-cli": 0.0.15
  "@vscode/test-electron": 3.1.0
  "@vscode/vsce": 4.0.0
  ovsx: 1.3.0
  "@vscode/l10n": 0.0.18
  "@vscode/l10n-dev": 0.0.35

# Biome 2.6.2 is newer than pnpm 12's default minimumReleaseAge.
minimumReleaseAgeExclude:
  - "@biomejs/biome@2.6.2"
  - "@biomejs/cli-android-arm64@2.6.2"
  - "@biomejs/cli-android-x64@2.6.2"
  - "@biomejs/cli-darwin-arm64@2.6.2"
  - "@biomejs/cli-darwin-x64@2.6.2"
  - "@biomejs/cli-linux-arm64-musl@2.6.2"
  - "@biomejs/cli-linux-arm64@2.6.2"
  - "@biomejs/cli-linux-x64-musl@2.6.2"
  - "@biomejs/cli-linux-x64@2.6.2"
  - "@biomejs/cli-win32-arm64@2.6.2"
  - "@biomejs/cli-win32-x64@2.6.2"

overrides:
  # client-node 2.0.1 pulls in @types/node ^26; the extension host runs Node 24.
  "@types/node": 24.19.2

# Build scripts allowed during installation (esbuild binary, vsce signatures).
allowBuilds:
  esbuild: true
  "@vscode/vsce-sign": true
